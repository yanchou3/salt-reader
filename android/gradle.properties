org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 必须关闭 release 的 R8 混淆：shared_preferences_android 2.5+ 用 Pigeon jnigen 生成绑定，
# Dart 侧以硬编码 JNI 签名（含 Lkotlin/coroutines/Continuation;）反射查找方法。
# 一旦 R8 重命名 kotlin.coroutines.Continuation 等类型，就会抛
# NoSuchMethodError: SharedPreferencesApiRegistrar.getAll(...Continuation;)。
# 插件本身没带 consumer proguard 规则，因此这里整体关掉压缩/混淆。
shrink=false
